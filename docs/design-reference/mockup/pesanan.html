<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detail Pesanan — VSP Sport Admin Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{
  --orange:#F2762A;--red:#C0392B;--grad:linear-gradient(90deg,#F2762A,#D2452A);
  --bg:#F7F6F4;--line:#EDE7E2;--ink:#1B1512;--ink2:#2A211C;--muted:#8A7C73;--muted2:#9A8C83;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Geist,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}

.hero{background:linear-gradient(135deg,#1E1512 0%,#3A1F14 55%,#7A2A1C 100%);position:relative;overflow:hidden;padding:22px 32px 78px}
.hero::after{content:"";position:absolute;right:-90px;top:-90px;width:320px;height:320px;border-radius:50%;
  background:radial-gradient(circle,rgba(242,118,42,.45),transparent 65%)}
.hero .in{position:relative;z-index:2;max-width:1120px;margin:0 auto}
.back{display:inline-flex;align-items:center;gap:8px;color:#E7DAD3;text-decoration:none;font-size:13px;font-weight:500;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);padding:8px 14px;border-radius:10px}
.back:hover{background:rgba(255,255,255,.15);color:#fff}
.back svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.hrow{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-top:22px;flex-wrap:wrap}
.hero h1{color:#fff;font-size:32px;font-weight:700;letter-spacing:.3px}
.hero .meta{color:#E0C7BB;font-size:13px;margin-top:6px}
.hero .logo{width:72px;height:72px;object-fit:contain;filter:drop-shadow(0 8px 20px rgba(0,0,0,.35))}

.wrap{max-width:1120px;margin:-56px auto 0;padding:0 32px 60px;position:relative;z-index:3}
.grid{display:grid;grid-template-columns:1.55fr 1fr;gap:20px;align-items:start}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 6px 22px rgba(40,25,18,.07)}
.card h2{font-size:14px;font-weight:700;padding:18px 22px;border-bottom:1px solid #F3EEEA}
.pad{padding:22px}

.badge{display:inline-block;border-radius:12px;padding:6px 14px;font-size:12px;font-weight:600}
.b-baru{background:#FDEEE4;color:#C0392B}.b-prod{background:#FFF2DC;color:#B07514}
.b-sel{background:#E7F3E7;color:#4F7A4E}.b-kirim{background:#EAEFFA;color:#3F5BA9}

.sum{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.sum .pct{font-size:34px;font-weight:700}
.track{height:9px;border-radius:5px;background:#F0EAE5;overflow:hidden}
.fill{height:100%;border-radius:5px;background:var(--grad)}
.fill.done{background:#5B8C5A}

.steps{list-style:none;margin-top:24px}
.steps li{display:flex;gap:14px;padding-bottom:20px;position:relative}
.steps li::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:#EFE9E4}
.steps li:last-child{padding-bottom:0}
.steps li:last-child::before{display:none}
.dot{width:24px;height:24px;border-radius:50%;flex:0 0 24px;display:grid;place-items:center;
  background:#F3EEEA;color:#B7AAA2;font-size:11px;font-weight:700;border:2px solid #fff;box-shadow:0 0 0 1px #EFE9E4}
.steps li.done .dot{background:var(--grad);color:#fff;box-shadow:none}
.steps li.now .dot{background:#fff;color:var(--red);box-shadow:0 0 0 3px #FDEEE4}
.steps b{font-size:13.5px;font-weight:600;display:block}
.steps span{font-size:12px;color:var(--muted2);display:block;margin-top:2px}
.steps li.pend b{color:#A2938A;font-weight:500}

.kv{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid #F5F1EE;font-size:13.5px}
.kv:last-child{border:0}
.kv span{color:var(--muted)}
.kv b{font-weight:600;text-align:right}

.cust{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.ini{width:44px;height:44px;border-radius:50%;background:#FCE9DE;color:var(--red);font-size:15px;font-weight:700;display:grid;place-items:center;flex:0 0 44px}
.cust b{font-size:15px;font-weight:600;display:block}
.cust span{font-size:12px;color:var(--muted2)}

.btns{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{flex:1;min-width:130px;border:0;border-radius:10px;padding:12px 16px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer}
.btn-p{background:var(--grad);color:#fff;box-shadow:0 4px 12px rgba(210,69,42,.32)}
.btn-g{background:#F5F1EE;color:#60544D}

.note{font-size:12.5px;color:var(--muted);line-height:1.65}

@media(max-width:860px){
  .hero{padding:16px 18px 70px}
  .hero h1{font-size:24px}
  .hero .logo{display:none}
  .hrow{margin-top:18px}
  .wrap{padding:0 18px 50px}
  .grid{grid-template-columns:1fr}
}
</style>
<script src="https://cdn.moda.app/runtime-libs/tailwind-browser-4.1.13-index.global.min.js"></script><style data-moda-export-fonts="true">@font-face { font-family: 'Geist'; src: url("../../fonts/geist-wght--thin.ttf") format("truetype"); font-style: normal; font-weight: 100; font-display: swap; }
@font-face { font-family: 'Geist'; src: url("../../fonts/geist-wght--extralight.ttf") format("truetype"); font-style: normal; font-weight: 200; font-display: swap; }
@font-face { font-family: 'Geist'; src: url("../../fonts/geist-wght--light.ttf") format("truetype"); font-style: normal; font-weight: 300; font-display: swap; }
@font-face { font-family: 'Geist'; src: url("../../fonts/geist-wght--regular.ttf") format("truetype"); font-style: normal; font-weight: 400; font-display: swap; }
@font-face { font-family: 'Geist'; src: url("../../fonts/geist-wght--medium.ttf") format("truetype"); font-style: normal; font-weight: 500; font-display: swap; }
@font-face { font-family: 'Geist'; src: url("../../fonts/geist-wght--semibold.ttf") format("truetype"); font-style: normal; font-weight: 600; font-display: swap; }
@font-face { font-family: 'Geist'; src: url("../../fonts/geist-wght--bold.ttf") format("truetype"); font-style: normal; font-weight: 700; font-display: swap; }
@font-face { font-family: 'Geist'; src: url("../../fonts/geist-wght--extrabold.ttf") format("truetype"); font-style: normal; font-weight: 800; font-display: swap; }
@font-face { font-family: 'Geist'; src: url("../../fonts/geist-wght--black.ttf") format("truetype"); font-style: normal; font-weight: 900; font-display: swap; }</style></head>
<body>

<header class="hero">
  <div class="in">
    <a class="back" href="/"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"></path></svg> Kembali ke Pesanan</a>
    <div class="hrow">
      <div>
        <h1 id="d-id">—</h1>
        <div class="meta" id="d-meta">—</div>
      </div>
      <img class="logo" src="../../images/442ccf2c-75e1-4396-96e5-8ae1bdb22f7d.png" alt="VSP Sport">
    </div>
  </div>
</header>

<div class="wrap">
  <div class="grid">

    <section>
      <div class="card">
        <h2>Progres Produksi</h2>
        <div class="pad">
          <div class="sum">
            <div>
              <div class="pct" id="d-pct">—</div>
              <div class="note" id="d-stage">—</div>
            </div>
            <span class="badge" id="d-badge">—</span>
          </div>
          <div class="track"><div class="fill" id="d-fill" style="width:0"></div></div>
          <ul class="steps" id="d-steps"></ul>
        </div>
      </div>
    </section>

    <aside>
      <div class="card" style="margin-bottom:20px">
        <h2>Customer</h2>
        <div class="pad">
          <div class="cust">
            <div class="ini" id="d-ini">—</div>
            <div><b id="d-cust">—</b><span id="d-contact">—</span></div>
          </div>
          <div class="btns">
            <button class="btn btn-p">Hubungi</button>
            <button class="btn btn-g">Riwayat</button>
          </div>
        </div>
      </div>

      <div class="card">
        <h2>Detail Order</h2>
        <div class="pad" style="padding-top:6px">
          <div class="kv"><span>Produk</span><b id="d-produk">—</b></div>
          <div class="kv"><span>Jumlah</span><b id="d-qty">—</b></div>
          <div class="kv"><span>Bahan</span><b id="d-bahan">—</b></div>
          <div class="kv"><span>Tanggal Order</span><b id="d-order">—</b></div>
          <div class="kv"><span>Deadline</span><b id="d-deadline">—</b></div>
          <div class="kv"><span>Status</span><b id="d-status">—</b></div>
          <div class="btns">
            <button class="btn btn-p">Edit Pesanan</button>
            <button class="btn btn-g">Cetak SPK</button>
          </div>
        </div>
      </div>
    </aside>

  </div>
</div>

<script>
var STEPS = ["Desain","Layout","Proofing Warna","Approval","Print","Press","Potong","Jahit","QC","Packing","Kirim"];

var DATA = {
  "TNT260924TNS2":{cust:"Segara (pptkh grajagan)",ini:"SE",produk:"Atasan Lengan Pendek",qty:"5 pcs",step:1,status:"Baru",badge:"b-baru",order:"24/09/2026",deadline:"02/10/2026",bahan:"Dryfit Milano",contact:"0812-3344-5566 · Banyuwangi"},
  "TNT260924HEN4":{cust:"SSB HW Hijau",ini:"SS",produk:"Setelan Lengan Pendek",qty:"4 pcs",step:1,status:"Baru",badge:"b-baru",order:"24/09/2026",deadline:"30/09/2026",bahan:"Dryfit Milano",contact:"0857-1122-3344 · Bantul"},
  "TNT260924T973":{cust:"SSB HW merah",ini:"SS",produk:"Setelan Lengan Pendek",qty:"1 pcs",step:1,status:"Baru",badge:"b-baru",order:"24/09/2026",deadline:"30/09/2026",bahan:"Dryfit Milano",contact:"0857-1122-3344 · Bantul"},
  "TNT260924EC84":{cust:"Segara (threevora )",ini:"SE",produk:"Atasan Lengan Pendek",qty:"15 pcs",step:2,status:"Produksi",badge:"b-prod",order:"24/09/2026",deadline:"02/10/2026",bahan:"Dryfit Serena",contact:"0812-3344-5566 · Banyuwangi"},
  "TNT260924HG8":{cust:"UAD HW Bantul U 13",ini:"UA",produk:"Setelan Lengan Pendek",qty:"2 pcs",step:1,status:"Baru",badge:"b-baru",order:"24/09/2026",deadline:"30/09/2026",bahan:"Dryfit Milano",contact:"0813-9988-7766 · Bantul"},
  "TNT260922JRWN":{cust:"Irwan PPDI Salman official",ini:"IR",produk:"Atasan Lengan Pendek",qty:"11 pcs",step:11,status:"Selesai",badge:"b-sel",order:"22/09/2026",deadline:"23/09/2026",bahan:"Dryfit Serena",contact:"0821-4455-6677 · Sleman"},
  "TNT260921RJMD":{cust:"Bangkit (invictus)",ini:"BA",produk:"Setelan Lengan Pendek",qty:"2 pcs",step:3,status:"Produksi",badge:"b-prod",order:"21/09/2026",deadline:"21/09/2026",bahan:"Dryfit Milano",contact:"0858-7788-9900 · Yogyakarta"},
  "TNT260918JXU":{cust:"Rajawali FC",ini:"RA",produk:"Setelan Lengan Panjang",qty:"8 pcs",step:8,status:"Siap Dikirim",badge:"b-kirim",order:"18/09/2026",deadline:"28/09/2026",bahan:"Dryfit Serena",contact:"0819-2233-4455 · Klaten"}
};

var id = new URLSearchParams(location.search).get('id');
var d = DATA[id] || DATA[Object.keys(DATA)[0]];
if(!DATA[id]) id = Object.keys(DATA)[0];

function set(k,v){ document.getElementById(k).textContent = v; }

set('d-id', id);
set('d-meta', d.qty + ' · ' + d.produk + ' · Order ' + d.order);
set('d-pct', d.step + '/11');
set('d-stage', 'Tahap sekarang: ' + STEPS[Math.min(d.step,11)-1]);
set('d-cust', d.cust); set('d-ini', d.ini); set('d-contact', d.contact);
set('d-produk', d.produk); set('d-qty', d.qty); set('d-bahan', d.bahan);
set('d-order', d.order); set('d-deadline', d.deadline); set('d-status', d.status);

var b = document.getElementById('d-badge');
b.textContent = d.status; b.className = 'badge ' + d.badge;

var f = document.getElementById('d-fill');
f.style.width = Math.round(d.step/11*100) + '%';
if(d.step >= 11) f.classList.add('done');

var ul = document.getElementById('d-steps');
STEPS.forEach(function(s,i){
  var n = i+1, cls = n < d.step ? 'done' : (n === d.step ? 'now' : 'pend');
  var li = document.createElement('li');
  li.className = cls;
  li.innerHTML = '<div class="dot">' + (n < d.step ? '&#10003;' : n) + '</div>' +
    '<div><b>' + s + '</b><span>' +
    (n < d.step ? 'Selesai' : n === d.step ? 'Sedang dikerjakan' : 'Belum mulai') + '</span></div>';
  ul.appendChild(li);
});
</script>

</body></html>
